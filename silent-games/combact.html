<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Combat Arena</title>
    <style>
        :root {
            --bg: #0c1410;
            --panel: #141f18;
            --accent: #6fd07f;
            --text: #e7f3ea;
            --text-dim: #8ea896;
            --danger: #d0776f;
            --border: #2a3b2f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            overflow: hidden;
            cursor: crosshair;
            touch-action: none;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .arena {
            width: 100%;
            height: 100%;
            position: relative;
            background:
                radial-gradient(circle at 20% 80%, rgba(111, 208, 127, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(208, 119, 111, 0.12) 0%, transparent 50%);
        }

        .back-btn {
            position: absolute;
            top: 2px;
            left: 12px;
            z-index: 110;
            color: var(--text-dim);
            font-size: 0.7rem;
            text-decoration: none;
        }

        @media (min-width: 768px) {
            .back-btn {
                top: 8px;
                font-size: 0.85rem;
            }
        }

        .character {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        @media (min-width: 768px) {
            .character {
                width: 80px;
                height: 80px;
                font-size: 24px;
            }
        }

        .player {
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            left: 10%;
            top: 50%;
            transform: translateY(-50%);
            color: white;
        }

        .enemy {
            background: linear-gradient(45deg, #ff4444, #cc0000);
            right: 10%;
            top: 50%;
            transform: translateY(-50%);
            color: white;
        }

        @media (min-width: 768px) {
            .player {
                left: 20%;
            }
            .enemy {
                right: 20%;
            }
        }

        .character.attacking {
            animation: attack 0.5s ease-in-out;
        }

        .character.heavy-attacking {
            animation: heavyAttack 0.8s ease-in-out;
        }

        .character.dodging {
            animation: dodge 0.3s ease-in-out;
        }

        .character.hit {
            animation: hit 0.5s ease-in-out;
        }

        @keyframes attack {
            0% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.2) translateX(50px); }
            100% { transform: translateY(-50%) scale(1); }
        }

        @keyframes heavyAttack {
            0% { transform: translateY(-50%) scale(1); }
            20% { transform: translateY(-50%) scale(1.5) translateX(20px); }
            50% { transform: translateY(-50%) scale(1.8) translateX(80px); }
            80% { transform: translateY(-50%) scale(1.3) translateX(60px); }
            100% { transform: translateY(-50%) scale(1); }
        }

        @keyframes dodge {
            0% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(0.8) translateY(-30px); }
            100% { transform: translateY(-50%) scale(1); }
        }

        @keyframes hit {
            0% { transform: translateY(-50%) scale(1); }
            25% { transform: translateY(-50%) scale(0.8) translateX(-20px); }
            50% { transform: translateY(-50%) scale(1.1) translateX(20px); }
            75% { transform: translateY(-50%) scale(0.9) translateX(-10px); }
            100% { transform: translateY(-50%) scale(1); }
        }

        .health-bar {
            position: absolute;
            top: 20px;
            width: 35%;
            max-width: 200px;
            height: 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .health-bar {
                top: 50px;
                height: 20px;
                border-radius: 10px;
            }
        }

        .player-health {
            left: 10px;
        }

        .enemy-health {
            right: 10px;
        }

        @media (min-width: 768px) {
            .player-health {
                left: 50px;
            }
            .enemy-health {
                right: 50px;
            }
        }

        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .player-health .health-fill {
            background: linear-gradient(90deg, #00ff88, #00cc66);
        }

        .enemy-health .health-fill {
            background: linear-gradient(90deg, #ff4444, #cc0000);
        }

        .warning {
            position: absolute;
            top: 45%;
            right: 5%;
            transform: translateY(-50%);
            background: rgba(208, 119, 111, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            animation: pulse 0.5s infinite alternate;
            display: none;
            z-index: 50;
        }

        @media (min-width: 768px) {
            .warning {
                top: 50%;
                right: 15%;
                padding: 10px 20px;
                font-size: 14px;
            }
        }

        @keyframes pulse {
            from { opacity: 0.7; transform: translateY(-50%) scale(0.9); }
            to { opacity: 1; transform: translateY(-50%) scale(1.1); }
        }

        .ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            width: 90%;
        }

        .score {
            font-size: 20px;
            margin-bottom: 5px;
        }

        @media (min-width: 768px) {
            .ui {
                top: 20px;
            }
            .score {
                font-size: 24px;
                margin-bottom: 10px;
            }
        }

        .instructions {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.3;
        }

        @media (min-width: 768px) {
            .instructions {
                font-size: 14px;
            }
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 200;
            width: 90%;
            max-width: 400px;
        }

        @media (min-width: 768px) {
            .game-over {
                padding: 30px;
            }
        }

        .restart-btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            touch-action: manipulation;
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        .charge-bar-container {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            display: none;
        }

        @media (min-width: 768px) {
            .charge-bar-container {
                top: 80px;
                height: 8px;
                border-radius: 4px;
            }
        }

        .charge-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffff00, #ff6600, #ff0000);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .stamina-bar {
            position: absolute;
            top: 45px;
            left: 10px;
            width: 35%;
            max-width: 150px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .stamina-bar {
                top: 80px;
                left: 50px;
                height: 12px;
                border-radius: 6px;
            }
        }

        .stamina-fill {
            height: 100%;
            background: linear-gradient(90deg, #00aaff, #0088cc);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .stamina-label {
            position: absolute;
            top: 57px;
            left: 10px;
            color: white;
            font-size: 10px;
            opacity: 0.8;
        }

        @media (min-width: 768px) {
            .stamina-label {
                top: 95px;
                left: 50px;
                font-size: 12px;
            }
        }
        
        .low-stamina {
            background: linear-gradient(90deg, #ff4444, #cc0000) !important;
            animation: lowStaminaPulse 0.5s infinite alternate;
        }
        
        @keyframes lowStaminaPulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        .swipe-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 30px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .swipe-indicator.show {
            opacity: 1;
            animation: swipeHint 1s ease-in-out infinite;
        }

        @keyframes swipeHint {
            0%, 100% { transform: translateX(-50%); }
            50% { transform: translateX(-30%); }
        }
        .settings-screen {
            position: absolute;
            inset: 0;
            z-index: 300;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 12px;
            overflow-y: auto;
            background: rgba(12, 20, 16, 0.96);
        }

        .settings-card {
            width: min(100%, 420px);
            margin: auto 0;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            text-align: center;
        }

        .settings-card h1 { margin-bottom: 5px; font-size: 1.5rem; }
        .settings-card p { color: var(--text-dim); line-height: 1.3; margin-bottom: 12px; }
        .difficulty-options { display: grid; gap: 6px; margin-bottom: 10px; text-align: left; }
        .difficulty-option {
            display: block;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
        }
        .difficulty-option:has(input:checked) {
            border-color: var(--accent);
            background: rgba(111, 208, 127, 0.12);
        }
        .difficulty-option input { margin-right: 8px; accent-color: var(--accent); }
        .difficulty-option small { display: block; margin: 2px 0 0 25px; color: var(--text-dim); }
        .start-btn { width: 100%; margin-top: 2px; }
        .advanced-toggle {
            margin: 2px 0 8px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
        }
        .advanced-panel {
            display: grid;
            gap: 6px;
            margin-bottom: 10px;
            text-align: left;
        }
        .advanced-setting { display: grid; gap: 4px; font-size: 0.85rem; }
        .advanced-setting span { display: flex; justify-content: space-between; color: var(--text-dim); }
        .advanced-setting output { color: var(--accent); font-weight: bold; }
        .advanced-setting input { width: 100%; accent-color: var(--accent); }
    </style>
</head>
<body>
    <div class="game-container">
        <a class="back-btn" href="/silent-games/">&larr; HaptiPlay</a>
        <div class="arena">
            <div class="ui">
                <div class="score">Punteggio: <span id="score">0</span></div>
                <div class="instructions">
                    Tap rapido: attacco • Tap lungo: attacco pesante • Swipe: schivata
                </div>
                <div class="charge-bar-container" id="chargeBarContainer">
                    <div class="charge-bar" id="chargeBar"></div>
                </div>
            </div>

            <div class="health-bar player-health">
                <div class="health-fill" id="playerHealth" style="width: 100%"></div>
            </div>

            <div class="health-bar enemy-health">
                <div class="health-fill" id="enemyHealth" style="width: 100%"></div>
            </div>

            <div class="stamina-bar">
                <div class="stamina-fill" id="staminaBar" style="width: 100%"></div>
            </div>
            <div class="stamina-label">Stamina</div>

            <div class="character player" id="player">⚔️</div>
            <div class="character enemy" id="enemy">👹</div>
            
            <div class="warning" id="warning">⚠️ ATTACCO!</div>
            <div class="swipe-indicator" id="swipeIndicator">👈 👉</div>
        </div>

        <div class="game-over" id="gameOver">
            <h2 id="gameOverText">Game Over!</h2>
            <p>Punteggio finale: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">Rigioca</button>
        </div>

        <div class="settings-screen" id="settingsScreen">
            <div class="settings-card">
                <h1>Combat Arena</h1>
                <p>Scegli quanto vuoi essere sfidato. Potrai rigiocare con questa scelta dopo ogni combattimento.</p>
                <div class="difficulty-options" role="radiogroup" aria-label="Difficoltà">
                    <label class="difficulty-option">
                        <input type="radio" name="difficulty" value="easy" checked>
                        <strong>Facile</strong>
                        <small>Più vita, più stamina e molto preavviso.</small>
                    </label>
                    <label class="difficulty-option">
                        <input type="radio" name="difficulty" value="normal">
                        <strong>Medio</strong>
                        <small>La sfida bilanciata.</small>
                    </label>
                    <label class="difficulty-option">
                        <input type="radio" name="difficulty" value="hard">
                        <strong>Difficile</strong>
                        <small>Meno margine d'errore e attacchi più rapidi.</small>
                    </label>
                </div>
                <button class="advanced-toggle" id="advancedToggle" type="button" aria-expanded="false">Opzioni avanzate</button>
                <div class="advanced-panel" id="advancedPanel" hidden>
                    <label class="advanced-setting">
                        <span>Vita giocatore <output id="advancedHealthValue">100</output></span>
                        <input id="advancedHealth" data-setting="health" type="range" min="40" max="140" step="5" value="100">
                    </label>
                    <label class="advanced-setting">
                        <span>Danno nemico <output id="advancedDamageValue">30</output></span>
                        <input id="advancedDamage" data-setting="damage" type="range" min="10" max="60" step="5" value="30">
                    </label>
                    <label class="advanced-setting">
                        <span>Intervallo attacchi <output id="advancedIntervalValue">100%</output></span>
                        <input id="advancedInterval" data-setting="interval" type="range" min="50" max="150" step="5" value="100">
                    </label>
                    <label class="advanced-setting">
                        <span>Preavviso <output id="advancedWarningValue">1250 ms</output></span>
                        <input id="advancedWarning" data-setting="warning" type="range" min="500" max="2200" step="50" value="1250">
                    </label>
                    <label class="advanced-setting">
                        <span>Recupero stamina <output id="advancedRecoveryValue">12/s</output></span>
                        <input id="advancedRecovery" data-setting="recovery" type="range" min="5" max="30" step="1" value="12">
                    </label>
                </div>
                <button class="restart-btn start-btn" id="startGameBtn">Inizia partita</button>
            </div>
        </div>
    </div>

    <script>
        // Sintetizza toni via Web Audio: raddoppia la vibrazione dove questa non esiste (iOS).
        const AudioFX = {
            ctx: null,
            ensure() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                return this.ctx;
            },
            tone(freq, duration, type = 'sine', gainPeak = 0.15) {
                const ctx = this.ensure();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(gainPeak, ctx.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            },
            warning() { this.tone(880, 0.12, 'square', 0.1); },
            hit() { this.tone(120, 0.3, 'sawtooth', 0.18); },
            dodge() { this.tone(660, 0.15, 'sine', 0.12); },
            staminaLow() { this.tone(260, 0.12, 'square', 0.1); },
            staminaEmpty() { this.tone(110, 0.22, 'sawtooth', 0.14); },
            win() { [523, 659, 784].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, 'triangle', 0.15), i * 120)); },
            lose() { [300, 220, 140].forEach((f, i) => setTimeout(() => this.tone(f, 0.35, 'sawtooth', 0.15), i * 150)); }
        };

        class CombatGame {
            constructor() {
                this.player = document.getElementById('player');
                this.enemy = document.getElementById('enemy');
                this.warning = document.getElementById('warning');
                this.playerHealthBar = document.getElementById('playerHealth');
                this.enemyHealthBar = document.getElementById('enemyHealth');
                this.scoreElement = document.getElementById('score');
                this.gameOverScreen = document.getElementById('gameOver');
                this.chargeBarContainer = document.getElementById('chargeBarContainer');
                this.chargeBar = document.getElementById('chargeBar');
                this.staminaBar = document.getElementById('staminaBar');
                this.swipeIndicator = document.getElementById('swipeIndicator');
                
                // Statistiche giocatore
                this.playerHealth = 100;
                this.maxPlayerHealth = 100;
                this.enemyHealth = 100;
                this.score = 0;
                this.isGameRunning = false;
                this.settingsScreen = document.getElementById('settingsScreen');
                this.advancedOverrides = {};
                
                // Sistema touch/swipe
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.touchStartTime = 0;
                this.isTouching = false;
                this.swipeThreshold = 100; // Distanza minima per swipe (in pixel)
                this.swipeTimeThreshold = 300; // Tempo massimo per completare swipe (in ms)
                this.dodgeWindow = false;
                this.canAttack = true;
                
                // Configurazioni nemico
                this.enemyMoveset = [2500, 3500, 2000, 4500, 3000]; // Pattern degli attacchi nemici (in millisecondi) - adattato per mobile
                this.currentMoveIndex = 0;
                this.enemyWarningTime = 1500; // Tempo di preavviso prima dell'attacco nemico (in ms) - aumentato per mobile
                this.enemyDamage = 25;
                
                // Sistema attacco pesante
                this.isCharging = false;
                this.chargeStartTime = 0;
                this.chargeThreshold = 600; // Tempo minimo per attacco pesante (in ms) - ridotto per mobile
                this.maxChargeTime = 2000; // Tempo massimo per carica completa (in ms)
                
                // SISTEMA STAMINA - VARIABILI CON COMMENTI
                this.maxStamina = 100; // Quantità massima di stamina disponibile
                this.currentStamina = this.maxStamina; // Stamina corrente del giocatore
                this.staminaRecoveryRate = 15; // Quanto velocemente la stamina si ricarica (punti al secondo)
                this.staminaRecoveryDelay = 1.5; // Quanti secondi di attesa dopo un'azione prima che la stamina inizi a ricaricarsi
                this.lightAttackCost = 10; // Quanta stamina consuma un attacco leggero
                this.heavyAttackCost = 30; // Quanta stamina consuma un attacco pesante
                this.dodgeCost = 20; // Quanta stamina consuma una schivata
                this.lastActionTime = 0; // Timestamp dell'ultima azione eseguita
                this.isRecoveringStamina = false; // Flag per controllare se la stamina si sta ricaricando
                this.staminaLoopRunning = false;
                this.lastStaminaFrame = 0;

                // Timer pendenti dell'attacco nemico, tracciati per poterli sospendere
                this.pendingWarningTimeout = null;
                this.pendingExecuteTimeout = null;
                this.isTabVisible = true;

                this.init();
            }

            // Rimette in gioco l'istanza esistente senza ri-registrare i listener globali
            // (altrimenti ad ogni restart si accumulano gestori duplicati sullo stesso document).
            reset() {
                this.playerHealth = this.maxPlayerHealth;
                this.enemyHealth = 100;
                this.score = 0;
                this.isGameRunning = true;
                this.currentStamina = this.maxStamina;
                this.currentMoveIndex = 0;
                this.dodgeWindow = false;
                this.canAttack = true;
                this.isCharging = false;
                this.lastActionTime = 0;
                this.clearPendingAttack();

                this.updateHealthBars();
                this.updateStaminaBar();
                this.scoreElement.textContent = '0';
                this.chargeBarContainer.style.display = 'none';
                this.player.className = 'character player';
                this.enemy.className = 'character enemy';
                this.warning.style.display = 'none';
                this.swipeIndicator.classList.remove('show');

                this.scheduleEnemyAttack();
                this.startStaminaRecovery();
            }

            init() {
                // Event listeners per touch
                document.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
                document.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
                document.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: false });

                // Mantieni anche mouse per desktop
                document.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                document.addEventListener('mouseup', (e) => this.handleMouseUp(e));
                document.addEventListener('mousemove', (e) => this.handleMouseMove(e));

                // Se la scheda va in background, sospendi l'attacco programmato: altrimenti
                // il giocatore subisce un colpo "alla cieca" senza aver visto/sentito l'avviso.
                document.addEventListener('visibilitychange', () => this.handleVisibilityChange());

                document.getElementById('startGameBtn').addEventListener('click', () => this.startGame());
                document.getElementById('advancedToggle').addEventListener('click', (e) => {
                    const panel = document.getElementById('advancedPanel');
                    panel.hidden = !panel.hidden;
                    e.currentTarget.setAttribute('aria-expanded', String(!panel.hidden));
                });
                document.querySelectorAll('.advanced-setting input').forEach((input) => {
                    input.addEventListener('input', () => {
                        this.advancedOverrides[input.dataset.setting] = Number(input.value);
                        document.getElementById(input.id + 'Value').textContent = input.dataset.setting === 'interval'
                            ? input.value + '%'
                            : input.dataset.setting === 'warning' ? input.value + ' ms'
                            : input.dataset.setting === 'recovery' ? input.value + '/s' : input.value;
                    });
                });
                document.querySelectorAll('input[name="difficulty"]').forEach((input) => {
                    input.addEventListener('change', () => this.applyPresetToAdvanced(input.value));
                });
                this.applyPresetToAdvanced('easy');
            }

            getDifficultyPreset(difficulty) {
                return {
                    easy: { health: 110, damage: 20, interval: 100, moves: [2800, 3600, 2400, 4300, 3200], warning: 1700, recovery: 20, costs: [10, 28, 18] },
                    normal: { health: 95, damage: 30, interval: 90, moves: [2200, 3000, 1800, 3800, 2600], warning: 1250, recovery: 12, costs: [12, 32, 22] },
                    hard: { health: 70, damage: 45, interval: 75, moves: [1300, 1900, 1100, 2400, 1600], warning: 800, recovery: 8, costs: [15, 38, 28] }
                }[difficulty];
            }

            applyPresetToAdvanced(difficulty) {
                const preset = this.getDifficultyPreset(difficulty);
                this.advancedOverrides = {};
                for (const [setting, value] of Object.entries({ health: preset.health, damage: preset.damage, interval: preset.interval, warning: preset.warning, recovery: preset.recovery })) {
                    const input = document.querySelector(`[data-setting="${setting}"]`);
                    input.value = value;
                    input.dispatchEvent(new Event('input'));
                }
            }

            startGame() {
                const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
                const preset = this.getDifficultyPreset(difficulty);
                const value = (key) => this.advancedOverrides[key] ?? preset[key];
                this.maxPlayerHealth = value('health');
                this.enemyDamage = value('damage');
                this.enemyMoveset = preset.moves.map((delay) => delay * value('interval') / 100);
                this.enemyWarningTime = value('warning');
                this.staminaRecoveryRate = value('recovery');
                [this.lightAttackCost, this.heavyAttackCost, this.dodgeCost] = preset.costs;
                this.settingsScreen.style.display = 'none';
                this.reset();
            }

            handleVisibilityChange() {
                if (document.hidden) {
                    this.isTabVisible = false;
                    this.clearPendingAttack();
                    this.warning.style.display = 'none';
                    this.swipeIndicator.classList.remove('show');
                    this.dodgeWindow = false;
                } else {
                    this.isTabVisible = true;
                    if (this.isGameRunning && !this.pendingWarningTimeout) {
                        this.scheduleEnemyAttack();
                    }
                }
            }

            clearPendingAttack() {
                if (this.pendingWarningTimeout) clearTimeout(this.pendingWarningTimeout);
                if (this.pendingExecuteTimeout) clearTimeout(this.pendingExecuteTimeout);
                this.pendingWarningTimeout = null;
                this.pendingExecuteTimeout = null;
            }

            // Gestione eventi touch
            handleTouchStart(e) {
                if (!this.isGameRunning) return;
                e.preventDefault();
                
                const touch = e.touches[0];
                this.touchStartX = touch.clientX;
                this.touchStartY = touch.clientY;
                this.touchStartTime = Date.now();
                this.isTouching = true;
                
                // Se posso attaccare, inizia a caricare
                if (this.canAttack) {
                    this.isCharging = true;
                    this.chargeStartTime = Date.now();
                    this.chargeBarContainer.style.display = 'block';
                    this.updateChargeBar();
                }
            }

            handleTouchMove(e) {
                if (!this.isTouching || !this.isGameRunning) return;
                e.preventDefault();
                
                const touch = e.touches[0];
                const deltaX = touch.clientX - this.touchStartX;
                const deltaY = Math.abs(touch.clientY - this.touchStartY);
                const deltaTime = Date.now() - this.touchStartTime;
                
                // Verifica se è uno swipe (movimento orizzontale significativo e rapido)
                if (Math.abs(deltaX) > this.swipeThreshold && deltaY < 50 && deltaTime < this.swipeTimeThreshold) {
                    if (this.dodgeWindow) {
                        this.dodgeAttack();
                        this.isTouching = false;
                        this.isCharging = false;
                        this.chargeBarContainer.style.display = 'none';
                    }
                }
            }

            handleTouchEnd(e) {
                if (!this.isTouching || !this.isGameRunning) return;
                e.preventDefault();
                
                this.isTouching = false;
                
                if (!this.isCharging) return;
                
                this.isCharging = false;
                this.chargeBarContainer.style.display = 'none';
                
                const touch = e.changedTouches[0];
                const deltaX = Math.abs(touch.clientX - this.touchStartX);
                const deltaY = Math.abs(touch.clientY - this.touchStartY);
                const touchDuration = Date.now() - this.touchStartTime;
                
                // Se non è stato uno swipe, esegui attacco
                if (deltaX < this.swipeThreshold && deltaY < 50) {
                    if (touchDuration >= this.chargeThreshold) {
                        this.playerHeavyAttack(touchDuration);
                    } else {
                        this.playerLightAttack();
                    }
                }
            }

            // Mantieni supporto mouse per desktop
            handleMouseDown(e) {
                if (!this.canAttack || !this.isGameRunning || e.touches) return;
                
                this.isCharging = true;
                this.chargeStartTime = Date.now();
                this.chargeBarContainer.style.display = 'block';
                this.updateChargeBar();
            }

            handleMouseUp(e) {
                if (!this.isCharging || !this.isGameRunning || e.touches) return;
                
                this.isCharging = false;
                this.chargeBarContainer.style.display = 'none';
                
                const chargeDuration = Date.now() - this.chargeStartTime;
                
                if (chargeDuration >= this.chargeThreshold) {
                    this.playerHeavyAttack(chargeDuration);
                } else {
                    this.playerLightAttack();
                }
            }

            // Sistema mouse per schivata desktop
            handleMouseMove(e) {
                if (e.touches) return; // Ignora se c'è touch attivo
                
                this.lastMouseX = this.mouseX || e.clientX;
                this.mouseX = e.clientX;
                
                const mouseSpeed = Math.abs(this.mouseX - this.lastMouseX);
                
                if (this.dodgeWindow && mouseSpeed > 100) {
                    this.dodgeAttack();
                }
            }

            // Vibrazione
            vibrate(pattern) {
                if ('vibrate' in navigator) {
                    navigator.vibrate(pattern);
                }
            }

            // Avvia un solo loop, anche quando si ricomincia dopo una sconfitta.
            startStaminaRecovery() {
                if (this.staminaLoopRunning) return;
                this.staminaLoopRunning = true;
                this.lastStaminaFrame = 0;
                requestAnimationFrame((time) => this.staminaRecoveryLoop(time));
            }

            // Loop di recupero stamina, misurato in secondi reali e non in frame.
            staminaRecoveryLoop(time) {
                if (!this.isGameRunning) {
                    this.staminaLoopRunning = false;
                    return;
                }

                const elapsed = this.lastStaminaFrame ? Math.min((time - this.lastStaminaFrame) / 1000, 0.1) : 0;
                this.lastStaminaFrame = time;
                const now = Date.now();
                const timeSinceLastAction = (now - this.lastActionTime) / 1000;
                
                if (timeSinceLastAction >= this.staminaRecoveryDelay && this.currentStamina < this.maxStamina) {
                    const recoveryAmount = this.staminaRecoveryRate * elapsed;
                    this.currentStamina = Math.min(this.maxStamina, this.currentStamina + recoveryAmount);
                    this.updateStaminaBar();
                    this.isRecoveringStamina = true;
                } else {
                    this.isRecoveringStamina = false;
                }
                
                requestAnimationFrame((nextTime) => this.staminaRecoveryLoop(nextTime));
            }

            updateStaminaBar() {
                const percentage = (this.currentStamina / this.maxStamina) * 100;
                this.staminaBar.style.width = percentage + '%';
                
                if (this.currentStamina < 20) {
                    this.staminaBar.classList.add('low-stamina');
                } else {
                    this.staminaBar.classList.remove('low-stamina');
                }
            }

            consumeStamina(amount) {
                if (this.currentStamina >= amount) {
                    const previousStamina = this.currentStamina;
                    this.currentStamina -= amount;
                    this.lastActionTime = Date.now();
                    this.updateStaminaBar();
                    if (this.currentStamina <= 0) {
                        this.notifyStaminaEmpty();
                    } else if (previousStamina >= this.dodgeCost && this.currentStamina < this.dodgeCost) {
                        this.notifyStaminaLow();
                    }
                    return true;
                }
                if (this.currentStamina <= 0) this.notifyStaminaEmpty();
                return false;
            }

            notifyStaminaLow() {
                this.vibrate([45, 70, 45]);
                AudioFX.staminaLow();
            }

            notifyStaminaEmpty() {
                this.vibrate([120, 70, 120]);
                AudioFX.staminaEmpty();
            }

            updateChargeBar() {
                if (!this.isCharging) return;
                
                const currentTime = Date.now();
                const chargeDuration = currentTime - this.chargeStartTime;
                const chargeProgress = Math.min(chargeDuration / this.maxChargeTime, 1) * 100;
                
                this.chargeBar.style.width = chargeProgress + '%';
                
                if (this.isCharging) {
                    requestAnimationFrame(() => this.updateChargeBar());
                }
            }

            playerLightAttack() {
                if (!this.consumeStamina(this.lightAttackCost)) {
                    this.showStaminaWarning();
                    return;
                }
                
                this.canAttack = false;
                this.player.classList.add('attacking');
                
                setTimeout(() => {
                    this.enemyHealth -= 15;
                    this.enemy.classList.add('hit');
                    this.updateHealthBars();
                    this.score += 8;
                    this.scoreElement.textContent = this.score;
                    
                    if (this.enemyHealth <= 0) {
                        this.endGame(true);
                    }
                    
                    setTimeout(() => {
                        this.enemy.classList.remove('hit');
                    }, 500);
                }, 250);
                
                setTimeout(() => {
                    this.player.classList.remove('attacking');
                    this.canAttack = true;
                }, 500);
            }

            playerHeavyAttack(chargeDuration) {
                if (!this.consumeStamina(this.heavyAttackCost)) {
                    this.showStaminaWarning();
                    return;
                }
                
                this.canAttack = false;
                this.player.classList.add('heavy-attacking');
                
                const chargeRatio = Math.min(chargeDuration / this.maxChargeTime, 1);
                const baseDamage = 25;
                const bonusDamage = Math.floor(chargeRatio * 20);
                const totalDamage = baseDamage + bonusDamage;
                
                setTimeout(() => {
                    this.enemyHealth -= totalDamage;
                    this.enemy.classList.add('hit');
                    this.updateHealthBars();
                    this.score += 15 + bonusDamage;
                    this.scoreElement.textContent = this.score;
                    
                    this.createHeavyAttackEffect(totalDamage);
                    
                    if (this.enemyHealth <= 0) {
                        this.endGame(true);
                    }
                    
                    setTimeout(() => {
                        this.enemy.classList.remove('hit');
                    }, 500);
                }, 400);
                
                setTimeout(() => {
                    this.player.classList.remove('heavy-attacking');
                    this.canAttack = true;
                }, 800);
            }

            dodgeAttack() {
                if (!this.dodgeWindow) return;

                if (!this.consumeStamina(this.dodgeCost)) {
                    return;
                }

                this.dodgeWindow = false;
                this.player.classList.add('dodging');
                this.score += 5;
                this.scoreElement.textContent = this.score;

                // Vibrazione leggera per schivata riuscita (+ tono per chi non ha vibrazione, es. iOS)
                this.vibrate(50);
                AudioFX.dodge();
                
                this.warning.style.display = 'none';
                this.swipeIndicator.classList.remove('show');
                
                setTimeout(() => {
                    this.player.classList.remove('dodging');
                }, 300);
                
                this.createDodgeEffect();
            }

            showStaminaWarning() {
                const effect = document.createElement('div');
                effect.textContent = 'STAMINA ESAURITA!';
                effect.style.cssText = `
                    position: absolute;
                    left: 50%;
                    top: 40%;
                    transform: translateX(-50%);
                    color: #ff4444;
                    font-weight: bold;
                    font-size: 16px;
                    pointer-events: none;
                    animation: floatUp 1s ease-out forwards;
                    z-index: 100;
                    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
                `;
                
                document.body.appendChild(effect);
                
                setTimeout(() => {
                    effect.remove();
                }, 1000);
            }

            createHeavyAttackEffect(damage) {
                const effect = document.createElement('div');
                effect.textContent = `CRITICO! +${damage}`;
                effect.style.cssText = `
                    position: absolute;
                    right: 15%;
                    top: 35%;
                    color: #ff6600;
                    font-weight: bold;
                    font-size: 18px;
                    pointer-events: none;
                    animation: floatUp 1.5s ease-out forwards;
                    z-index: 100;
                    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
                `;
                
                document.body.appendChild(effect);
                
                setTimeout(() => {
                    effect.remove();
                }, 1500);
            }

            // La difficoltà cresce col punteggio: attacchi più ravvicinati e preavviso più corto,
            // ma con un pavimento che lascia sempre il tempo materiale di reagire.
            getDifficultyFactor() {
                return Math.max(0.55, 1 - this.score / 400);
            }

            scheduleEnemyAttack() {
                if (!this.isGameRunning || !this.isTabVisible) return;

                const baseDelay = this.enemyMoveset[this.currentMoveIndex];
                this.currentMoveIndex = (this.currentMoveIndex + 1) % this.enemyMoveset.length;
                // Jitter ±15% cosi il pattern non è più memorizzabile a orecchio/tempo.
                const jitter = 0.85 + Math.random() * 0.3;
                const delay = baseDelay * this.getDifficultyFactor() * jitter;

                this.pendingWarningTimeout = setTimeout(() => {
                    this.pendingWarningTimeout = null;
                    this.enemyAttackWarning();
                }, delay);
            }

            enemyAttackWarning() {
                if (!this.isGameRunning) return;

                // Vibrazione di avviso (pattern: 100ms on, 100ms off, 100ms on) + tono per iOS
                this.vibrate([100, 100, 100]);
                AudioFX.warning();

                this.warning.style.display = 'block';
                this.swipeIndicator.classList.add('show');
                this.dodgeWindow = true;

                // Anche il preavviso si accorcia leggermente con la difficoltà, ma mai sotto un minimo giocabile.
                const warningTime = Math.max(900, this.enemyWarningTime * this.getDifficultyFactor());

                this.pendingExecuteTimeout = setTimeout(() => {
                    this.pendingExecuteTimeout = null;
                    this.executeEnemyAttack();
                }, warningTime);
            }

            executeEnemyAttack() {
                if (!this.isGameRunning) return;

                this.warning.style.display = 'none';
                this.swipeIndicator.classList.remove('show');
                this.enemy.classList.add('attacking');

                if (this.dodgeWindow) {
                    setTimeout(() => {
                        // Vibrazione forte per colpo subito (500ms) + tono per iOS
                        this.vibrate(500);
                        AudioFX.hit();

                        this.playerHealth -= this.enemyDamage;
                        this.player.classList.add('hit');
                        this.updateHealthBars();

                        if (this.playerHealth <= 0) {
                            this.endGame(false);
                        }

                        setTimeout(() => {
                            this.player.classList.remove('hit');
                        }, 500);
                    }, 250);
                }

                setTimeout(() => {
                    this.enemy.classList.remove('attacking');
                    this.dodgeWindow = false;
                    this.scheduleEnemyAttack();
                }, 500);
            }

            createDodgeEffect() {
                const effect = document.createElement('div');
                effect.textContent = '+5 SCHIVATA!';
                effect.style.cssText = `
                    position: absolute;
                    left: 15%;
                    top: 40%;
                    color: #00ff88;
                    font-weight: bold;
                    font-size: 16px;
                    pointer-events: none;
                    animation: floatUp 1s ease-out forwards;
                    z-index: 100;
                `;
                
                document.body.appendChild(effect);
                
                setTimeout(() => {
                    effect.remove();
                }, 1000);
                
                if (!document.getElementById('floatUpStyle')) {
                    const style = document.createElement('style');
                    style.id = 'floatUpStyle';
                    style.textContent = `
                        @keyframes floatUp {
                            0% { opacity: 1; transform: translateY(0); }
                            100% { opacity: 0; transform: translateY(-50px); }
                        }
                    `;
                    document.head.appendChild(style);
                }
            }

            updateHealthBars() {
                this.playerHealthBar.style.width = Math.max(0, this.playerHealth / this.maxPlayerHealth * 100) + '%';
                this.enemyHealthBar.style.width = Math.max(0, this.enemyHealth) + '%';
            }

            endGame(playerWon) {
                this.isGameRunning = false;
                this.warning.style.display = 'none';
                this.swipeIndicator.classList.remove('show');
                
                const gameOverText = document.getElementById('gameOverText');
                const finalScore = document.getElementById('finalScore');
                
                gameOverText.textContent = playerWon ? '🏆 Vittoria!' : '💀 Sconfitta!';
                finalScore.textContent = this.score;

                // Vibrazione finale + tono per iOS
                if (playerWon) {
                    this.vibrate([100, 50, 100, 50, 100]); // Vibrazione di vittoria
                    AudioFX.win();
                } else {
                    this.vibrate(1000); // Vibrazione lunga di sconfitta
                    AudioFX.lose();
                }

                this.gameOverScreen.style.display = 'block';
            }
        }

        // Avvia il gioco
        let game = new CombatGame();

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            // Riusa la stessa istanza: ricrearne una nuova registrava un secondo set di
            // listener touch/mouse su document ad ogni partita, raddoppiando via via
            // attacchi e consumo di stamina per ogni tocco.
            game.reset();
        }
    </script>
